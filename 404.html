<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Coder Stats Card</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f5fc" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      (function () {
        var choice;
        try {
          choice = localStorage.getItem("coder-stats-card-theme");
        } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a href="/" class="brand">
          <img src="/favicon.svg" alt="" width="26" height="26" />
          <span>Coder Stats Card</span>
        </a>
      </header>
      <main class="not-found">
        <p class="not-found-code">404</p>
        <h1 class="h2">This page doesn't exist</h1>
        <p class="note">The link may be old or mistyped. Card links start with <code>/api/card</code>.</p>
        <p><a class="button button-primary" href="/">Go to Coder Stats Card</a></p>
      </main>
    </div>
  </body>
</html>
